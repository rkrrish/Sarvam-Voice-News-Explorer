services:
  news-voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sarvam_news_agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
